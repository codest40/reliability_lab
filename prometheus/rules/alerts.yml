groups:

  - name: sre-service-level
    rules:

      # ==========================================================
      # HTTP AVAILABILITY
      # ==========================================================

      - alert: HighHTTPErrorRate
        expr: |
          (
            sum(rate(http_responses_total{status=~"5.."}[5m]))
            /
            clamp_min(
              sum(rate(http_responses_total[5m])),
              0.000001
            )
          ) > 0.01

        #for: 5m

        labels:
          severity: critical
          service: reciever
          component: http
          category: availability

        annotations:
          summary: "High HTTP 5xx error rate"
          description: "The Reciever service is returning more than 1% HTTP 5xx responses."


      # ==========================================================
      # HTTP LATENCY
      # ==========================================================

      - alert: HighHTTPLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket[5m])
            )
          ) > 2

        labels:
          severity: warning
          service: reciever
          component: http
          category: latency

        annotations:
          summary: "High HTTP p95 latency"
          description: "HTTP p95 latency has exceeded 2 seconds."


      # ==========================================================
      # QUEUE
      # ==========================================================

      - alert: QueueNearCapacity
        expr: |
          queue_utilization > 0.8

        labels:
          severity: warning
          service: reciever
          component: queue
          category: saturation

        annotations:
          summary: "Queue approaching capacity"
          description: "The request queue is more than 80% utilized."


      - alert: QueueRejectedRequests
        expr: |
          sum by (queue) (
            rate(queue_rejections_total[5m])
          ) > 0

        labels:
          severity: critical
          service: reciever
          component: queue
          category: backpressure

        annotations:
          summary: "Requests are being rejected"
          description: "The request queue is rejecting requests because capacity is exhausted."


      # ==========================================================
      # DEPENDENCY
      # ==========================================================

      - alert: DependencyUnhealthy
        expr: |
          dependency_health == 0

        for: 1m

        labels:
          severity: critical
          service: reciever
          component: dependency
          category: availability

        annotations:
          summary: "Saver dependency is unhealthy"
          description: "The Saver dependency is reporting an unhealthy state."


      # ==========================================================
      # CIRCUIT BREAKER
      # ==========================================================

      - alert: CircuitBreakerOpen
        expr: |
          circuit_breaker_state == 1

        labels:
          severity: critical
          service: reciever
          component: circuit_breaker
          category: availability

        annotations:
          summary: "Circuit breaker is OPEN"
          description: "Traffic to the Saver dependency is currently being blocked."


      # ==========================================================
      # RETRIES
      # ==========================================================

      - alert: RetryExhaustion
        expr: |
          sum(rate(retry_exhausted_total[5m])) > 0

        labels:
          severity: critical
          service: reciever
          component: retry
          category: availability

        annotations:
          summary: "Retries are being exhausted"
          description: "Requests are failing even after all retry attempts have been exhausted."

      - alert: SREAlertTest
        expr: vector(1)

        labels:
          severity: warning
          service: reciever
          component: alerting
          category: test

        annotations:
          summary: "SRE alerting test"
          description: "This is a test alert confirming that Prometheus alert rules are working. Hello confirm!!!"
