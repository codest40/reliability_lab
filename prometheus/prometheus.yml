global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - /etc/prometheus/rules/alerts.yml

scrape_configs:
  - job_name: "reciever"
    static_configs:
      - targets:
          - "reciever:5000"
